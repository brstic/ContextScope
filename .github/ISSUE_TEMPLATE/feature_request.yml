name: Feature request
description: Suggest an improvement, a provider endpoint or an optimization rule
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to understand or optimize?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: docs
    attributes:
      label: Provider documentation links (for new endpoints or usage fields)
