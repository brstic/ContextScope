name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:web
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm dlx playwright install --with-deps chromium
      - name: E2E smoke (CLI start, mock upstreams, proxy byte fidelity, live feed, no secret leaks)
        run: pnpm test:e2e
      - name: Dashboard check (every page, desktop + phone, dark + light, all controls)
        env:
          CHROME_PATH: ''
        run: |
          node packages/cli/dist/bin.js demo --port 3377 --data-dir .ci-demo &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3377/api/health >/dev/null && break; sleep 0.5; done
          node scripts/screenshots.mjs http://127.0.0.1:3377 shots
      - name: CLI smoke
        run: |
          node packages/cli/dist/bin.js --version
          node packages/cli/dist/bin.js doctor || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: shots
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: contextscope:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name cs -p 127.0.0.1:3377:3377 -e CONTEXTSCOPE_AUTH_TOKEN=ci-token-0123456789abcdef contextscope:ci
          for i in $(seq 1 30); do
            curl -fsS -H 'authorization: Bearer ci-token-0123456789abcdef' http://127.0.0.1:3377/api/health && exit 0
            sleep 1
          done
          docker logs cs
          exit 1
